project_id = "rh-raizes-do-futuro"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173/**"]
jwt_expiry = 900
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
[functions.email-2fa]
verify_jwt = true

[functions.datasul-bridge]
verify_jwt = false

[functions.platform-bridge]
verify_jwt = false

[functions.manager-activation]
verify_jwt = false

[auth.email.template.invite]
subject = "Seu acesso ao Raízes do Futuro"
content_path = "./templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirme seu Gmail | Raízes do Futuro"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha | Raízes do Futuro"
content_path = "./templates/recovery.html"

[auth.email.template.magic_link]
subject = "Seu acesso seguro | Raízes do Futuro"
content_path = "./templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail | Raízes do Futuro"
content_path = "./templates/email_change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} é seu código | Raízes do Futuro"
content_path = "./templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha foi alterada | Raízes do Futuro"
content_path = "./templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = true
subject = "Seu e-mail foi alterado | Raízes do Futuro"
content_path = "./templates/email_changed_notification.html"

[auth.email.notification.phone_changed]
enabled = true
subject = "Seu telefone foi alterado | Raízes do Futuro"
content_path = "./templates/phone_changed_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = true
subject = "Novo método de verificação | Raízes do Futuro"
content_path = "./templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = true
subject = "Método de verificação removido | Raízes do Futuro"
content_path = "./templates/mfa_factor_unenrolled_notification.html"

[auth.email.notification.identity_linked]
enabled = true
subject = "Novo método de entrada conectado | Raízes do Futuro"
content_path = "./templates/identity_linked_notification.html"

[auth.email.notification.identity_unlinked]
enabled = true
subject = "Método de entrada removido | Raízes do Futuro"
content_path = "./templates/identity_unlinked_notification.html"
