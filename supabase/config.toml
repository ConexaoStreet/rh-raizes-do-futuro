project_id = "rh-raizes-do-futuro"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:4173"
additional_redirect_urls = ["http://localhost:4173/**"]
jwt_expiry = 900
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
[functions.email-2fa]
verify_jwt = true

[functions.datasul-bridge]
verify_jwt = false

[functions.platform-bridge]
verify_jwt = false

[functions.manager-activation]
verify_jwt = false
