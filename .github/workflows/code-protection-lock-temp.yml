name: Code Protection Lock Temp
on:
  push:
    branches:
      - security/code-protection
    paths:
      - ".github/workflows/code-protection-lock-temp.yml"
      - "package.json"
      - "apps/ti/package.json"
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/ti
      - run: |
          if ! git diff --quiet package-lock.json apps/ti/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json apps/ti/package-lock.json
            git commit -m "chore: lock production minifier"
            git push origin HEAD:security/code-protection
          fi
