name: TI App

on:
  push:
    branches:
      - main
    paths:
      - "apps/ti/**"
      - ".github/workflows/ti-app.yml"
  pull_request:
    paths:
      - "apps/ti/**"
      - ".github/workflows/ti-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ti
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build T.I app
        run: npm run build
