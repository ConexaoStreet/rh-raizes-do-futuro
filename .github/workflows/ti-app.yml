name: TI App

on:
  push:
    branches:
      - main
    paths:
      - "apps/ti/**"
      - ".github/workflows/ti-app.yml"
  pull_request:
    paths:
      - "apps/ti/**"
      - ".github/workflows/ti-app.yml"

concurrency:
  group: ti-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ti
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ti/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build T.I app
        run: npm run build
      - name: Check bundle budget
        run: npm run check:bundle
