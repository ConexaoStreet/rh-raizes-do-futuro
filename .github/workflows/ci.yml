name: CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: deno check --no-lock supabase/functions/*/index.ts
      - run: npm run check:privacy
      - run: node tests/auth-template-sync.mjs
      - run: node tests/auth-hardening-config.mjs
      - run: node tests/observability-source.mjs
      - run: npm run test -- --passWithNoTests
      - run: npm run test:database
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
