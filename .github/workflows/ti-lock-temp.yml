name: TI Lock Temp
on:
  push:
    branches:
      - feat/frontend-quality-pass
    paths:
      - ".github/workflows/ti-lock-temp.yml"
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/ti
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ti/package-lock.json
          git commit -m "chore: lock TI dependencies"
          git push origin HEAD:feat/frontend-quality-pass
