name: Source Audit Snapshot
on:
  push:
    branches:
      - audit/full-code-review-20260924
    paths:
      - ".github/workflows/source-audit.yml"
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit-snapshot
          path: |
            .
            !.git
            !node_modules
            !dist
            !playwright-report
            !test-results
          include-hidden-files: true
          retention-days: 1
