name: Frontend Audit Temp
on:
  push:
    branches:
      - feat/frontend-quality-pass
    paths:
      - ".github/workflows/frontend-audit-temp.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Production audit
        run: npm audit --omit=dev --json || true
      - name: Full audit
        run: npm audit --json || true
