name: Frontend Audit Temp
on:
  push:
    branches:
      - feat/frontend-quality-pass
    paths:
      - ".github/workflows/frontend-audit-temp.yml"
      - "package.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh dependency lockfile"
            git push origin HEAD:feat/frontend-quality-pass
          fi
      - run: npm ci
      - name: Production audit
        run: npm audit --omit=dev --json || true
      - name: Full audit
        run: npm audit --json || true
