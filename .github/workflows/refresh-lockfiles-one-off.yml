name: Temporary dependency lockfile regeneration
on:
  push:
    branches:
      - fix/raizes-general-20261102
    paths:
      - .github/workflows/refresh-lockfiles-one-off.yml
permissions:
  contents: write
jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lockfiles for pinned security fixes
        run: |
          rm package-lock.json apps/ti/package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/ti install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/ti/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(lockfile): refresh verified security dependency versions"
            git push
          fi
