<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0b1713" />
    <meta name="description" content="Central de T.I · Raízes do Futuro" />
    <meta name="application-name" content="T.I Raízes do Futuro" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>T.I · Raízes do Futuro</title>
    <script>
      (() => {
        const stored = localStorage.getItem("raizes-theme");
        const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = resolved;
        const theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", resolved === "dark" ? "#08110e" : "#f4f7f4");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
