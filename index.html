<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#152522" />
    <meta name="description" content="Gestão de RH · Raízes do Futuro" />
    <meta name="application-name" content="Raízes do Futuro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raízes RH" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Raízes do Futuro | RH</title>
    <script>
      (() => {
        const stored = localStorage.getItem("raizes-theme");
        const mode = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const resolved = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = resolved;
        const theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", resolved === "dark" ? "#09120f" : "#f5f7f5");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
